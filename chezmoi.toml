[data.validation]
warn_on_empty = true

[data.system.xdg]
data_home = "$HOME/.local/share"
config_home = "$HOME/.config"
state_home = "$HOME/.local/state"
cache_home = "$HOME/.cache"

[data.proxy]
http = "http://localhost:7890"
https = "https://localhost:7890"

[data.lib]
dev_sdk_root = "$HOME/Libraries"
pkg_config_path = "" # blank

vulkan_sdk_version = "" # blank

[data.language.cpp]
cc = "" # blank
cxx = "" # blank
cmake_generator = "Ninja"

[data.app.homebrew]
pip_index_url = "https://mirrors.aliyun.com/pypi/simple/"
api_domain = "https://mirrors.aliyun.com/homebrew-bottles/api"
bottle_domain = "https://mirrors.aliyun.com/homebrew-bottles"