# ~/.config/tmuxinator/dsh-services.yml
# 启动方式: tmuxinator start dsh-services
# 停止方式: tmuxinator stop dsh-services
# 附着方式: tmuxinator attach dsh-services (或 tmux a -t dsh-services)

name: dsh-services
attach: false
root: ~/

# 启动前自动 kill 已有同名 session，避免冲突
on_project_start: tmux kill-session -t dsh-services 2>/dev/null || true

# 项目结束时不做额外清理（tmuxinator stop 会自动 kill）
on_project_stop: ""

windows:
  # ── DeepSeek Harness Web UI ──────────────────────────────
  - dsh-web:
      layout: even-horizontal
      panes:
        - |
          echo "🚀 Starting DeepSeek Harness Web UI..."
          npx --verbose -y @deepseek-ai/dsh web
        # 可选：在此追加第二个 pane，例如 tail 日志
        # - tail -f ~/.dsh/logs/dsh-web.log

  # ── OpenViking Server (Agent Team) ───────────────────────
  - openviking:
      layout: even-horizontal
      panes:
        - |
          echo "🚀 Starting OpenViking Server..."
          openviking-server


