# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: locale
  name: "@deepseek-ai/dsh-client-locale"
  config:
    preference: zh
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      wanzhao-grok:
        displayName: 晚照云-Grok
        apiKeyEnv: WANZHAO_GROK_API_KEY
        api: openai-completions
        baseURL: https://sub.wanzhao.top
        models:
          - id: composer-2.5
            name: composer-2.5
          - id: grok-4.5-latest
            name: grok-4.5-latest
          - id: grok-4.6-latest
            name: grok-4.6-latest
          - id: grok-imagine-image-2.0
            name: Grok Imagine Image 2.0
      wanzhao-gpt:
        displayName: 晚照云-GPT
        apiKeyEnv: WANZHAO_GPT_API_KEY
        api: openai-completions
        baseURL: https://sub.wanzhao.top
        defaultInput:
          - text
          - image
        models:
          - id: gpt-6-astra
            name: GPT-6 Astra
            contextWindow: 1050000
          - id: gpt-image-2.5-sunburst
            name: GPT Image 2.5 Sunburst
          - id: gpt-6.1-sol
            name: GPT-6.1 Sol
            contextWindow: 1050000
      wanzhao-glm:
        apiKeyEnv: WANZHAO_GLM_API_KEY
        displayName: 晚照云-GLM
        api: openai-completions
        baseURL: https://sub.wanzhao.top
        models:
          - id: glm-5.3
            name: glm-5.3
          - id: glm-5.3-flash
            name: glm-5.3-flash
      codex-not-limited-gpt:
        displayName: Codex不限量-GPT
        apiKeyEnv: CODEX_NOT_LIMITED_GPT_API_KEY
        api: openai-completions
        baseURL: https://codex.0u0o.com/v1
        models:
          - id: gpt-6-astra
            name: GPT-6 Astra
            contextWindow: 1050000
            maxTokens: 32000
            input:
              - text
              - image
          - id: gpt-image-2
            name: GPT Image 2
          - id: gpt-6.1-sol
            name: GPT-6.1 Sol
            input:
              - text
              - image
            contextWindow: 1050000
      kimi-coding:
        models:
          - id: k3
            name: Kimi K3
            contextWindow: 1048576
            maxTokens: 131072
            input:
              - text
              - image
          - id: k3.1-pro
            name: Kimi K3.1 Pro
            contextWindow: 1048576
            maxTokens: 131072
            input:
              - text
              - image
          - id: kimi-for-coding
            name: kimi-for-coding
            contextWindow: 1048576
            maxTokens: 32768
            input:
              - text
              - image
        apiKeyEnv: KIMI_CODING_API_KEY
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: kimi-coding
    model: k3.1-pro
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: ptc
- id: image-gen
  name: dsh-image-gen
  config:
    provider: openai-compat
    openaiCompatBaseURL: https://sub.wanzhao.top
    openaiCompatModel: gpt-image-2.5-flare
    openaiCompatQuality: ""
    openaiCompatQualityOptions:
      - auto
      - low
      - medium
      - high
    openaiCompatExtraBody: {}
    openaiCompatEditSizeMode: auto
    openaiCompatEditFormat: multipart
    openaiCompatEditExtra: {}
    openaiCompatSizes: {}
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
- id: tool-plugin-manager
  disabled: false

- insert:
    - id: mcp-blender
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: blender
        transport: stdio
        command: uvx
        args:
          - mcp-for-blender
        failOnStartupError: true
- id: subagent-model-selection-settings
  name: "@deepseek-ai/dsh-tool-subagent/model-selection-settings"
  config:
    enabled: true
    allowedModels:
      - provider: kimi-coding
        model: kimi-for-coding
      - provider: kimi-coding
        model: k3.1-pro
      - provider: wanzhao-glm
        model: glm-5.3-flash
- id: plugin-market
  name: "@deepseek-ai/dsh-plugin-market"
  config:
    indexes:
      - https://dshopen.org/index.json
- id: subagent
  name: "@deepseek-ai/dsh-subagent"
  config:
    maxDepth: 2
